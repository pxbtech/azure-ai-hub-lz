name: Terraform Plan

# Runs terraform plan whenever a pull request touches the Terraform tree.
# Read-only. Posts no comments by default; add tfcmt or actions/github-script
# if you want PR comments.

on:
  pull_request:
    paths:
      - 'iac/terraform/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_DIR: iac/terraform
  ARM_USE_OIDC:        true
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: terraform fmt check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -var-file=terraform.tfvars.example -out=tfplan
